version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: designpilot-backend
    env_file:
      - ./backend/.env  
    environment:
      # .env içinde yoksa fallback olarak bunu kullanır
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/designpilot}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/auth-ui
      dockerfile: Dockerfile
    container_name: designpilot-frontend
    ports:
      - "3001:3000"   # Tarayıcıdan http://localhost:3001
    environment:
      # İstersen Next.js tarafında burayı kullanırsın
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: designpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: designpilot
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
